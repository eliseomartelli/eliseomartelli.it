{{ define "main" }}
<div style="margin-top: 1rem;">
  <div class="photos-grid">
    {{ range $index, $page := sort .Pages "Title" "asc" }}
    <a href="{{ $page.RelPermalink }}" class="photo-card {{ if eq $index 0 }}photo-card-hero{{ else }}photo-card-sub{{ end }}">
      {{ with $page.Params.thumbnail }}
      <img src="{{ . }}" alt="{{ $page.Title }}" />
      {{ end }}
      <div class="photo-card-overlay">
        <h3>{{ $page.Title }}</h3>
      </div>
    </a>
    {{ end }}
  </div>
</div>
{{ end }}
