<style>
  :root {
    --width: 720px;
    --font-main: Verdana, sans-serif;
    --font-secondary: Verdana, sans-serif;
    --font-scale: 1em;
    --background-color: #f0f0f0;
    --heading-color: #000000;
    --text-color: #222222;
    --link-color: #a81d27;
    --visited-color: #790c16;
    --blockquote-color: #90151f;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --background-color: #222222;
      --heading-color: #f0f0f0;
      --text-color: #f0f0f0;
      --link-color: #deb1b2;
      --visited-color: #c98789;
      --blockquote-color: #deb1b2;
    }
  }

  body {
    font-family: var(--font-secondary);
    font-size: var(--font-scale);
    margin: auto;
    padding: 20px;
    max-width: var(--width);
    text-align: left;
    background-color: var(--background-color);
    word-wrap: break-word;
    overflow-wrap: break-word;
    color: var(--text-color);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    box-sizing: border-box;
  }

  main {
    flex: 1 0 auto;
    min-height: 100vh;
    line-height: 1.6;
  }

  h1,
  h2,
  h3,
  h4,
  h5,
  h6 {
    font-family: var(--font-main);
    color: var(--heading-color);
  }

  a {
    color: var(--link-color);
    cursor: pointer;
    text-decoration: none;
  }

  a:hover {
    text-decoration: underline;
  }

  nav a {
    margin-right: 8px;
  }

  strong,
  b {
    color: var(--heading-color);
  }

  button {
    margin: 0;
    cursor: pointer;
  }

  time {
    font-family: monospace;
    font-style: normal;
    font-size: 15px;
  }

  table {
    width: 100%;
  }

  hr {
    border: 0;
    border-top: 1px dashed;
  }

  img,
  iframe,
  video,
  embed,
  object {
    max-width: 100%;
  }

  code {
    font-family: monospace;
    padding: 2px;
    border-radius: 3px;
  }

  blockquote {
    border-left: 1px solid #999;
    color: var(--blockquote-color);
    padding-left: 20px;
    font-style: italic;
  }

  footer {
    padding: 25px 0;
    text-align: center;
  }

  .title:hover {
    text-decoration: none;
  }

  .title h1 {
    font-size: 1.5em;
  }

  .inline {
    width: auto !important;
  }

  .highlight,
  .code {
    border-radius: 3px;
    margin-block-start: 1em;
    margin-block-end: 1em;
    overflow-x: auto;
  }

  .highlight pre,
  .code pre {
    min-width: 100%;
    width: max-content;
  }

  /* blog post list */
  ul.blog-posts {
    list-style-type: none;
    padding: unset;
  }

  ul.blog-posts li {
    display: flex;
  }

  ul.blog-posts li span {
    flex: 0 0 130px;
  }

  ul.blog-posts li a:visited {
    color: var(--visited-color);
  }

  /* post navigator */
  .post-navigator {
    font-size: 0.8em;
    display: flex;
    gap: 16px;
    justify-content: space-between;
  }

  .post-navigator p {
    margin: 0;
  }

  .nav-disabled {
    opacity: 0.35;
  }

  /* footer links grid */
  .footer-links {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 0.5rem;
    margin-top: 2rem;
    margin-bottom: 1.5rem;
    text-align: left;
  }

  .footer-copyright {
    margin-bottom: 1.5rem;
    text-align: left;
  }

  /* secondary button link */
  .btn-secondary {
    display: inline-block;
    padding: 0.65rem 0.9rem;
    border-radius: 4px;
    border: 1px solid #999;
  }
</style>
